name: nextjs
type: service
from: node
fromVersionConstraint: "^2.1.0"
fromVersion: "2.1.0"
title: Node.js (Next.js)
labels:
- nextjs
- node

env:
- name: NODE_ENV
  value: production
  envType: dev

build:
  dockerfile: Dockerfile
  connect: true
  boilerplates:
  - name: nextjs
    title: Next.js Boilerplate
    repo: https://github.com/wodby/nextjs-boilerplate
    branch: main

workspace:
  reload: watch
